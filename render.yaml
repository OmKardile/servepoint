# ─────────────────────────────────────────────────────────────────────────────
# ServePoint — smartPOS · Render Blueprint (Infrastructure-as-Code)
# ADR-0008: Multi-Platform Cloud Deployment (Render Static + Vercel Edge)
#
# Apply: Render Dashboard → New + → Blueprint → select this repository.
# Render reads this file and provisions the service below.
#
# SERVICE NAME — `servepoint-tsos` (v5.2.2, owner request: the render link should
# read "servepoint"). The default URL follows the service name, so the deployment
# lives at https://servepoint-tsos.onrender.com. Chosen over the bare `servepoint`
# by live probe, not guesswork: `servepoint-tsos` returned Render's clean
# "service not found" (unclaimed → we get the exact name), while
# `servepoint.onrender.com` connected but never responded (claimed/limbo record —
# applying under it would append a random suffix, defeating the purpose).
# ⚠️ Renaming an already-applied service re-provisions it on the next blueprint
# sync: the old URL (tsos-pos.onrender.com) is retired, NOT redirected.
#
# WHY A STATIC SITE AND NOT A WEB SERVICE?
#   ServePoint is a pure client-side Vite SPA. Every backend concern — PostgreSQL,
#   Auth, Realtime websockets, Row Level Security — lives in Supabase, so no
#   Node/SSR/API server process is needed at runtime. A Render Web Service
#   free instance sleeps after 15 min of inactivity (50s+ cold starts —
#   unacceptable for a cashier POS or a diner scanning a table QR code),
#   while Static Sites are free CDN assets that NEVER sleep.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: servepoint-tsos
    runtime: static
    autoDeploy: true                    # deploy on every push to the branch
    pullRequestPreviewsEnabled: true    # free preview URLs for PRs

    # Install devDependencies explicitly (Vite/TypeScript live in
    # devDependencies) then emit the production bundle to ./dist.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist

    # SPA fallback — deep links like /coolkafe/pos, /:slug/t1?token=…,
    # /track/:id and /superadmin must serve index.html so React Router
    # can take over (otherwise they 404 on hard refresh / QR scan).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Caching & security headers.
    # Vite emits content-hashed filenames under /assets/ → cache forever;
    # index.html must always revalidate so new deploys propagate instantly.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

    # Vite inlines VITE_* variables into the bundle at BUILD time.
    # Credentials are intentionally HARDCODED here (product decision) so the
    # blueprint applies with zero manual prompts and every deploy boots
    # connected to the live project.
    #
    #   VITE_SUPABASE_ANON_KEY is the PUBLIC anon key — safe to embed
    #   client-side; data is protected by Supabase Row Level Security.
    #   ⚠️ NEVER put the service_role key here — server-side only.
    envVars:
      - key: NODE_VERSION
        value: "22"                     # Vite 8 requires Node ≥ 20.19 / 22.12
      - key: VITE_SUPABASE_URL
        value: https://gehjsxopcowmotgrrcgc.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_igzjkrzX7PLfNI4hlI8p4g_FeqvHI32
      # Design-pipeline token (owner-provided, file_content: read scope).
      # Used by tooling/agents to read the ServePoint POS Preview Figma and
      # sync design tokens/screenshots into docs/design/servepoint/ (ADR-0012).
      #
      # ⚠️ WHY sync:false — GitHub Push Protection (GH013) rejects any push
      # containing a Figma PAT ("Figma Personal Access Token" is a protected
      # secret class), so the value cannot live in this file. The blueprint
      # declares the variable; Render prompts for the value once at apply
      # time and stores it in the service environment (never in Git).
      # The working value is committed NOWHERE — it lives in the local
      # gitignored .env (FIGMA_TOKEN=figd_…, see ADR-0012) and in the
      # owner's Figma → Settings → Personal access tokens (revocable).
      - key: FIGMA_TOKEN
        sync: false
