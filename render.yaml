# ─────────────────────────────────────────────────────────────────────────────
# TSOS — The Cafe Operating System · Render Blueprint (Infrastructure-as-Code)
# ADR-0008: Multi-Platform Cloud Deployment (Render Static + Vercel Edge)
#
# Apply: Render Dashboard → New + → Blueprint → select this repository.
# Render reads this file and provisions the service below.
#
# WHY A STATIC SITE AND NOT A WEB SERVICE?
#   TSOS is a pure client-side Vite SPA. Every backend concern — PostgreSQL,
#   Auth, Realtime websockets, Row Level Security — lives in Supabase, so no
#   Node/SSR/API server process is needed at runtime. A Render Web Service
#   free instance sleeps after 15 min of inactivity (50s+ cold starts —
#   unacceptable for a cashier POS or a diner scanning a table QR code),
#   while Static Sites are free CDN assets that NEVER sleep.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: tsos-pos
    runtime: static
    autoDeploy: true                    # deploy on every push to the branch
    pullRequestPreviewsEnabled: true    # free preview URLs for PRs

    # Install devDependencies explicitly (Vite/TypeScript live in
    # devDependencies) then emit the production bundle to ./dist.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist

    # SPA fallback — deep links like /coolkafe/pos, /:slug/t1?token=…,
    # /track/:id and /superadmin must serve index.html so React Router
    # can take over (otherwise they 404 on hard refresh / QR scan).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Caching & security headers.
    # Vite emits content-hashed filenames under /assets/ → cache forever;
    # index.html must always revalidate so new deploys propagate instantly.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

    # Vite inlines VITE_* variables into the bundle at BUILD time, so they
    # must be set in the Render dashboard when the blueprint is applied.
    # `sync: false` keeps values out of the repository — Render will prompt
    # for them during blueprint apply.
    #
    #   VITE_SUPABASE_URL      e.g. https://<project-ref>.supabase.co
    #   VITE_SUPABASE_ANON_KEY public anon key (safe client-side; data is
    #                          protected by Supabase Row Level Security).
    #                          ⚠️ NEVER put the service_role key here —
    #                          it must stay server-side only.
    envVars:
      - key: NODE_VERSION
        value: "22"                     # Vite 8 requires Node ≥ 20.19 / 22.12
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
